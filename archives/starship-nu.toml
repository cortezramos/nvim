#Activar modo vim
#$env.config.edit_mode = "vi"

add_newline = false

# A minimal left prompt
format = """$directory$character"""
palette = "catppuccin_mocha"

# move the rest of the prompt to the right
right_format = """$all"""
command_timeout = 1000

[character]
vicmd_symbol = "[N] >>>"
success_symbol = '[➜](bold green)'

[directory.substitutions]
"~/tests/starship-custom" = "work-project"

[git_branch]
symbol = " 󰊢"
style = "bold bright-purple"
format = '[$symbol$branch]($style)'

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol]($style)"
detect_files = ["package.json", ".node-version", "pnpm-lock.yaml", "yarn.lock"]

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol]($style)"

[php]
symbol = " "
style = "bold blue"
format = "[$symbol]($style)"

[java]
symbol = " "
style = "bold yellow"
format = "[$symbol]($style)"

[c]
symbol = " "
style = "bold blue"
format = "[$symbol]($style)"

[lua]
symbol = " "
style = "bold blue"
format = "[$symbol]($style)"

[username]
format = ""
show_always = false

[cmd_duration]
format = ""
disabled = true

[time]
format = ""
disabled = true

[kubernetes]
disabled = true

[docker_context]
disabled = true

[battery]
disabled = true

[package]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
